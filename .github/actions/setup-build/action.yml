name: Setup build
description: Installs Rust (wasm32 target), binaryen and Java/Maven

inputs:
  java-version:
    description: "JDK version (default: the java version of .sdkmanrc)"
    default: ""
  binaryen-version:
    description: binaryen release (wasm-opt)
    default: "123"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - name: Install binaryen
      shell: bash
      env:
        BINARYEN_VERSION: ${{ inputs.binaryen-version }}
      run: |
        dir="$RUNNER_TEMP/binaryen"
        mkdir -p "$dir"
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
          | tar -xz -C "$dir" --strip-components=1
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/wasm-opt" --version
    - name: Read Java version
      id: java
      shell: bash
      env:
        JAVA_VERSION: ${{ inputs.java-version }}
      run: |
        # 17.0.20-tem -> 17.0.20
        version="${JAVA_VERSION:-$(sed -n 's/^java=\([^-]*\).*/\1/p' .sdkmanrc)}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ steps.java.outputs.version }}
        cache: maven
        # Maven Central credentials, only set by the release workflow
        server-id: central
        server-username: MAVEN_CENTRAL_USERNAME
        server-password: MAVEN_CENTRAL_PASSWORD
